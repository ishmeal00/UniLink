<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Sign in — UniLink</title><link rel="stylesheet" href="/theme.css"></head><body><main class="hero"><section class="card" style="width:min(420px,calc(100% - 32px));text-align:center"><div class="brand">Uni<span>Link</span></div><h1 style="font-size:32px;margin:22px 0 6px">Welcome</h1><p class="muted" id="sub">We'll email you a one-time code.</p><form id="form"><input class="input" id="email" type="email" autocomplete="username webauthn" placeholder="you@example.com" required><input class="input" id="code" inputmode="numeric" maxlength="6" placeholder="6-digit code" style="display:none;margin-top:10px"><button class="btn primary" style="width:100%;margin-top:12px" id="submit">Continue</button></form><p class="muted" id="msg" style="font-size:13px;margin-top:14px"></p><a href="/" class="muted" style="font-size:13px">← Back</a></section></main><script>const A=window.hatchable.auth;let step="email";const f=document.querySelector("#form"),email=document.querySelector("#email"),code=document.querySelector("#code"),btn=document.querySelector("#submit"),msg=document.querySelector("#msg");f.onsubmit=async e=>{e.preventDefault();msg.textContent="";try{if(step==="email"){await A.startLogin({email:email.value.trim()});step="code";code.style.display="block";btn.textContent="Sign in";msg.textContent="Check your email for the code."}else{await A.verifyCode({email:email.value.trim(),code:code.value.trim()});location.href=new URLSearchParams(location.search).get("next")||"/"}}catch(err){msg.textContent=err.message||"Something went wrong."}};</script></body></html>
